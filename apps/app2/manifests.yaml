apiVersion: apps/v1
metadata:
 name: app2
 labels:
   purpose: ingress-demo
   app: app2
kind: Deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      purpose: ingress-demo
      app: app2
  template:
   metadata:
     name: app2
     labels:
       purpose: ingress-demo
       app: app2
   spec:
     containers:
       - name: nginx
         image: chakradhar05/app2:v1
---
apiVersion: v1
kind: Service
metadata:
 name: app2
spec:
  selector:
    purpose: ingress-demo
    app: app2
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
   alb.ingress.kubernetes.io/scheme: internet-facing       # allow for external traffic
   alb.ingress.kubernetes.io/target-type: ip  # Directly to pod
   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
   alb.ingress.kubernetes.io/group.name: roboshop   # grouping rules to an alb.
spec:
  ingressClassName: alb
  rules:
  - host: "app2.chakra86.shop"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app2
            port:
              number: 80
